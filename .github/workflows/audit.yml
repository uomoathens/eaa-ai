name: Accountability audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      config:
        description: Configuration file to audit
        default: configs/default.yaml
        required: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[acs]"
      - uses: actions/cache@v5
        with:
          path: .cache/acs
          key: acs-pums-2018-1-Year-CA
      - name: Run governed training
        env:
          CONFIG: ${{ inputs.config || 'configs/default.yaml' }}
        run: eaa-ai run --config "$CONFIG" --output outputs/governed --summary "$GITHUB_STEP_SUMMARY" --strict
      - name: Run unconstrained baseline for comparison
        if: always()
        run: eaa-ai run --config configs/baseline.yaml --output outputs/baseline --summary "$GITHUB_STEP_SUMMARY"
      - name: Run governed training on real ACS public coverage data
        if: always()
        run: eaa-ai run --config configs/acs_public_coverage.yaml --output outputs/acs_public_coverage --summary "$GITHUB_STEP_SUMMARY"
      - name: Run unconstrained baseline on real ACS public coverage data
        if: always()
        run: eaa-ai run --config configs/acs_baseline.yaml --output outputs/acs_baseline --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify ledger integrity
        if: always()
        run: |
          eaa-ai verify --ledger outputs/governed/audit_ledger.jsonl
          eaa-ai verify --ledger outputs/acs_public_coverage/audit_ledger.jsonl
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eaa-ai-audit
          path: outputs/
          retention-days: 90
