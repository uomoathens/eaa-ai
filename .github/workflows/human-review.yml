name: Human review

on:
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: Run ID of the Accountability audit workflow to review
        required: true
      decision:
        description: Review decision
        type: choice
        options: [approve, reject]
        required: true
      reviewer_role:
        description: Accountable role under the AI Act
        type: choice
        options: [deployer, provider, oversight-board]
        default: deployer
        required: true
      note:
        description: Justification recorded in the ledger (required)
        required: true

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: eaa-ai-audit
          path: outputs/
          run-id: ${{ inputs.audit_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the original audit ledger as the base
        run: cp outputs/governed/audit_ledger.jsonl outputs/audit_base_ledger.jsonl
      - name: Continue from the most recent review of this audit, if any
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=eaa-ai-reviewed-$AUDIT_RUN_ID&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$previous" ]; then
            echo "Continuing from review run $previous"
            gh run download "$previous" -n "eaa-ai-reviewed-$AUDIT_RUN_ID" -D outputs/previous_review
            cp -f outputs/previous_review/* outputs/governed/
          else
            echo "First review of audit run $AUDIT_RUN_ID"
          fi
      - name: Check the ledger still extends the original audit
        run: eaa-ai verify --ledger outputs/governed/audit_ledger.jsonl --extends outputs/audit_base_ledger.jsonl
      - name: Record human review in the ledger
        env:
          NOTE: ${{ inputs.note }}
          DECISION: ${{ inputs.decision }}
          ROLE: ${{ inputs.reviewer_role }}
          REVIEWER: ${{ github.actor }}
        run: >
          eaa-ai approve
          --ledger outputs/governed/audit_ledger.jsonl
          --reviewer-role "$ROLE"
          --reviewer-unit "$REVIEWER"
          --decision "$DECISION"
          --note "$NOTE"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify the reviewed ledger
        run: eaa-ai verify --ledger outputs/governed/audit_ledger.jsonl --extends outputs/audit_base_ledger.jsonl
      - uses: actions/upload-artifact@v6
        with:
          name: eaa-ai-reviewed-${{ inputs.audit_run_id }}
          path: outputs/governed/
          retention-days: 365
