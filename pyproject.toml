[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eaa-ai"
version = "0.1.0"
description = "Explainable Accountability-Aware AI Architecture: fairness-constrained learning with SHAP explanations, a hash-chained audit ledger and an EU AI Act oriented deployment gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dimitrios Sargiotis" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
acs = ["folktables>=0.0.12"]

[project.scripts]
eaa-ai = "eaa_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
